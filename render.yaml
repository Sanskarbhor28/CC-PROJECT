# Render Blueprint: deploys the API on Render's free web service.
# Set DATABASE_URL in the Render dashboard (the connection string from Neon). Never commit it.
# API_KEY is generated by Render; copy the same value into the Streamlit Cloud secrets.
# NOTE: reconstructed to match deploy/bootstrap.py and requirements-api.txt - not yet run on Render.
services:
  - type: web
    name: smart-parking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt && python -m ml.train
    startCommand: python -m deploy.bootstrap && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: TOTAL_SLOTS
        value: "30"
      - key: SEED_DEMO_DATA
        value: "true"
